{% load static %}
<section class="gen-tool-workspace">
    <form method="post" class="gen-split">
        {% csrf_token %}

        <div class="gen-pane gen-pane--input">
            <div class="gen-pane__toolbar">
                <div class="gen-pane__toolbar-left">
                    <span class="gen-pane__indicator" aria-hidden="true"></span>
                    <span class="gen-pane__label">Entrée</span>
                </div>
            </div>
            <div class="gen-pane__body">
                <div class="gen-field">
                    <label for="{{ form.language.id_for_label }}" class="gen-field__label">Langage cible</label>
                    {{ form.language }}
                </div>
                <div class="gen-field">
                    <label for="{{ form.plantuml.id_for_label }}" class="gen-field__label">PlantUML source</label>
                    {{ form.plantuml }}
                </div>
            </div>
            <div class="gen-pane__footer">
                <button type="submit" class="gen-btn gen-btn--primary">
                    Générer le code
                </button>
                {% if error_message %}
                <div class="gen-alert" role="alert">{{ error_message }}</div>
                {% endif %}
            </div>
        </div>

        <div class="gen-split__connector" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
            </svg>
        </div>

        <div class="gen-pane gen-pane--output">
            <div class="gen-pane__toolbar">
                <div class="gen-pane__toolbar-left">
                    <span class="gen-pane__indicator" aria-hidden="true"></span>
                    <label for="id_generated_code" class="gen-pane__title">Code généré</label>
                </div>
                <button
                    id="copyGeneratedCodeBtn"
                    type="button"
                    class="gen-btn gen-btn--ghost"
                >
                    Copier
                </button>
            </div>
            <div class="gen-pane__body">
                <div class="gen-preview-text">
                    <textarea
                        id="id_generated_code"
                        rows="18"
                        readonly
                        class="gen-code-editor gen-code-editor--preview"
                    >{{ generated_code }}</textarea>
                </div>
            </div>
        </div>
    </form>

    <script src="{% static 'js/codegenerator/codegenerator.js' %}" defer></script>
</section>
