{% extends "base.html" %}
{% load static %}

{% block title %}Innovation Hub - Django 2026{% endblock %}

{% block content %}
<section class="relative flex min-h-[420px] items-center justify-center overflow-hidden rounded-[2rem] border border-white/5 bg-[#0a0f1d] shadow-2xl">

    <div class="absolute inset-0 pointer-events-none opacity-20"
         style="background-image: linear-gradient(#2563eb 1px, transparent 1px), linear-gradient(90deg, #2563eb 1px, transparent 1px); background-size: 60px 60px; transform: perspective(1000px) rotateX(60deg) translateY(-100px);">
    </div>

    <div class="parallax-layer absolute -top-40 -left-20 h-[600px] w-[600px] rounded-full bg-blue-600/20 blur-[120px]" data-speed="2"></div>
    <div class="parallax-layer absolute bottom-0 right-0 h-[500px] w-[500px] rounded-full bg-indigo-600/10 blur-[100px]" data-speed="-2"></div>

    <div class="parallax-layer relative z-10 px-4 text-center" data-speed="4">
        <div class="mb-6 inline-flex items-center gap-2 rounded-full border border-blue-500/20 bg-blue-500/10 px-3 py-1 text-xs font-bold uppercase tracking-widest text-blue-400">
            <span class="relative flex h-2 w-2">
              <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-blue-400 opacity-75"></span>
              <span class="relative inline-flex h-2 w-2 rounded-full bg-blue-500"></span>
            </span>
            Conception 3D
        </div>
        <h1 class="mb-6 text-5xl font-black tracking-tight text-white md:text-7xl">
            <span class="sublime-hero-dark-title">Interface </span><span class="sublime-hero-dark-accent">Cognitive</span>
        </h1>
        <p class="mx-auto mb-10 max-w-2xl text-lg font-medium leading-relaxed text-gray-400 md:text-xl">
            Portfolio et outils de conception.
            Propulsé par <span class="border-b-2 border-blue-500 text-white">HTMX</span> et Django.
        </p>
        <a href="{% url 'users:generation_tools' %}" class="inline-flex transform items-center justify-center rounded-2xl bg-white px-8 py-4 font-bold text-black transition-all duration-300 hover:-translate-y-1 hover:bg-blue-500 hover:text-white active:scale-95">
            Outils de génération
            <svg class="ml-2 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
        </a>
    </div>

    <div class="absolute top-0 left-0 h-[1px] w-full animate-[scanner_4s_linear_infinite] bg-gradient-to-r from-transparent via-blue-400 to-transparent opacity-30"></div>
</section>

<script>
    document.addEventListener('mousemove', (e) => {
        const layers = document.querySelectorAll('.parallax-layer');
        const x = (window.innerWidth - e.pageX * 2) / 100;
        const y = (window.innerHeight - e.pageY * 2) / 100;
        layers.forEach(layer => {
            const speed = layer.getAttribute('data-speed');
            layer.style.transform = `translateX(${x * speed}px) translateY(${y * speed}px)`;
        });
    });
</script>
{% endblock %}
